[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ko

; Gather LOCTEXT/NSLOCTEXT declared in C++ source (UI/GameMode text).
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source
ExcludePathFilters=Source/*/Intermediate/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.inl
ShouldGatherFromEditorOnlyData=false

; Skill descriptions serialize editor-authored FText format arguments into runtime assets.
[GatherTextStep1]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/P_RD/DataAsset/SkillData
FileNameFilters=*.h
FileNameFilters=*.cpp
ShouldGatherFromEditorOnlyData=true

; Gather FText stored in assets (DataAsset skill/artifact names, WBP-baked labels).
; 소스가 한국어인 항목은 en archive 에 영어 번역을 채워 en 모드에서 영어로 나온다.
; (원문 언어를 뒤집지 않는다 -- 에디터에서 디자이너가 보는 이름은 한국어 유지.)
[GatherTextStep2]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/BP/*
IncludePathFilters=Content/UI/*
ExcludePathFilters=Content/*/Developers/*
PackageFileNameFilters=*.uasset
ShouldGatherFromEditorOnlyData=false

; Write manifest and culture archives.
[GatherTextStep3]
CommandletClass=GenerateGatherManifest

[GatherTextStep4]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

; Import edited PO files, compile runtime resources, then export PO files for editing.
[GatherTextStep5]
CommandletClass=InternationalizationExport
bImportLoc=true

[GatherTextStep6]
CommandletClass=GenerateTextLocalizationResource
ResourceName=Game.locres

[GatherTextStep7]
CommandletClass=InternationalizationExport
bExportLoc=true
