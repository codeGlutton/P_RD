; Initial Android streaming budgets (MiB), pending the target-device soak tests.
; Keep these at scalability priority so changing graphics quality changes memory use.
; The engine's Android_Low/Mid/High/Epic profiles select tiers 0/1/2/3 initially.

[TextureQuality@0]
r.Streaming.PoolSize=256
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@1]
r.Streaming.PoolSize=384
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@2]
r.Streaming.PoolSize=512
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@3]
r.Streaming.PoolSize=768
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@Cine]
r.Streaming.PoolSize=768
r.Streaming.LimitPoolSizeToVRAM=1
