[/Script/UnrealEd.ProjectPackagingSettings]
+MapsToCook=(FilePath="/Game/SVN/TestLevel/HoJae/L_TestLevel")
; SVN AICreation 텍스처 uasset(타이틀 로고/버튼 등)을 쿡해 .pak에 포함.
; 위젯이 TSoftObjectPtr(C++ 기본값)로 참조하지만, 쿠커는 C++ CDO의 soft 참조를 의존성으로 자동 감지하지 못함(검증됨:
; 이 라인 빼면 Title 텍스처가 쿡 0개 → 디바이스에서 빈 화면). 확실히 없애려면 WBP에서 텍스처를 직접 지정해야 함.
+DirectoriesToAlwaysCook=(Path="/Game/SVN/OutSideAsset/AICreation")
; 런타임에 디스크 파일로 직접 읽는 raw 미디어(인트로/타이틀 mp4 영상)를 loose 파일로 .pak(=APK 내부)에 포함.
; (PNG 스틸은 uasset으로 전환돼 위에서 쿡됨. mp4만 uasset이 아니라 파일 재생이라 여기서 스테이징.)
; 경로는 Content 기준 상대. 미설정 시 디바이스에 파일이 없어 인트로/타이틀이 빈 화면(전 버전)으로 보였음.
+DirectoriesToAlwaysStageAsUFS=(Path="SVN")

