+DirectoriesToAlwaysCook=(Path="/Game/SVN/OutSideAsset/AICreation/UI/Marchbound")
;+DirectoriesToAlwaysCook=(Path="/Game/SVN/OutSideAsset/AICreation/UI/Map")
; 월드맵 노드 아이콘(T_MapNode_*)은 UFrontendMapNodeWidget 생성자에서 하드 레퍼런스 로드하므로 강제 쿡 제거.
;+DirectoriesToAlwaysCook=(Path="/Game/SVN/OutSideAsset/AICreation/UI/MapNode")
