; TopMenuBar는 모든 방에서 월드맵/설정 공용 팝업을 여는 인게임 진입점이라 월드 위젯 0번에 연결한다.
mWorldWidgetClasses[0]=/Game/BP/UI/WBP_TopMenuBar.WBP_TopMenuBar_C
; EWorldWidgetType enum index에 맞춘 월드 위젯 클래스 매핑이다.
; WorldWidgetSubsystem::InitWorldWidget()은 이 배열에서 클래스를 찾아 CreateWidget()으로 인스턴스만 준비한다.
; 실제 화면 표시는 여기서 하지 않고, GameMode가 필요 시 OpenUI()/CloseUI()를 호출한다.
; [3] FadeInOut, [4] LoadingNotify는 WBP 없이도 전환/로딩 흐름을 검증할 수 있게 둔 C++ 기본 위젯 클래스다.
mWorldWidgetClasses[3]=/Script/P_RD.FadeInOutWidget
mWorldWidgetClasses[4]=/Script/P_RD.LoadingNotifyWidget
; WorldMap/InGameSettings는 방 HUD에 묶이지 않는 공용 팝업이라 WorldWidgetSubsystem에서 타입별로 생성한다.
; [5] WorldMap은 MAP 버튼 조회용과 전투 승리 후 다음 방 선택용을 같은 WBP_FrontendMap으로 공유한다.
; [6] InGameSettings는 타이틀 SETTING 버튼과 인게임 SET 버튼이 함께 여는 공용 WBP_SettingsPanel이다.
; 두 진입점 모두 OpenUI()/CloseUI() 생명주기를 사용하므로 WBP_TitleMenu 안에 별도 설정 화면을 두지 않는다.
mWorldWidgetClasses[5]=/Game/BP/UI/WBP_FrontendMap.WBP_FrontendMap_C
mWorldWidgetClasses[6]=/Game/BP/UI/WBP_SettingsPanel.WBP_SettingsPanel_C
; DicePanel/SkillPanel도 탑바 버튼으로 여는 플로팅 패널이라 같은 월드 위젯 배열에 둔다.
; 아직 실제 주사위/스킬 게임 로직은 붙지 않았지만, WBP 표시/닫기/터치 반응은 OpenUI/CloseUI 흐름으로 미리 맞춘다.
; enum 값 순서가 바뀌면 이 배열 index도 같이 바꿔야 하므로 EWorldWidgetType::DicePanel, SkillPanel 순서와 맞춰둔다.
mWorldWidgetClasses[7]=/Game/BP/UI/WBP_DicePanel.WBP_DicePanel_C
mWorldWidgetClasses[8]=/Game/BP/UI/WBP_SkillPanel.WBP_SkillPanel_C
