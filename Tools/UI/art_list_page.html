<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px 20px 30px; background: #14161a; color: #dfe3ea;
    font: 14px/1.5 "Malgun Gothic", system-ui, sans-serif;
  }
  h1 { font-size: 16px; margin: 0 0 3px; }
  h2 { font-size: 13px; margin: 0 0 6px; color: #8b93a1; font-weight: normal; }
  .hint { color: #8b93a1; font-size: 12.5px; margin: 0 0 12px; }
  kbd {
    background: #262c37; border: 1px solid #39404e; border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; font: inherit; font-size: 12px;
  }
  .cols { display: flex; gap: 18px; align-items: flex-start; }
  #side {
    flex: 0 0 300px; max-height: 84vh; overflow: auto;
    border: 1px solid #2a303b; border-radius: 8px; background: #0d0f12;
    padding: 8px;
  }
  .grp { margin-bottom: 10px; }
  .grp > h3 {
    font-size: 12.5px; margin: 0 0 2px; padding: 4px 7px; color: #ffd24a;
    background: #1c212b; border-radius: 5px; font-weight: normal;
  }
  .grp .who { font-size: 11.5px; color: #79818f; padding: 0 8px 4px; }
  .it {
    display: flex; gap: 8px; align-items: center; padding: 4px 7px;
    border-radius: 5px; cursor: pointer; font-size: 12.5px;
  }
  .it:hover { background: #1e232d; }
  .it.on { background: #2f4670; color: #fff; }
  .chip {
    flex: 0 0 28px; height: 28px; border-radius: 4px; padding: 1px;
    background-color: #1b202a;
    background-image:
      linear-gradient(45deg, #262c38 25%, transparent 25%),
      linear-gradient(-45deg, #262c38 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #262c38 75%),
      linear-gradient(-45deg, transparent 75%, #262c38 75%);
    background-size: 8px 8px;
    background-position: 0 0, 0 4px, 4px -4px, -4px 0;
    display: flex; align-items: center; justify-content: center;
  }
  .chip img { max-width: 100%; max-height: 100%; }
  .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .it.gone .nm { color: #d97a7a; }

  #main { flex: 1 1 auto; min-width: 0; }
  #canvas {
    border: 1px solid #2a303b; border-radius: 8px; padding: 26px 18px 18px;
    min-height: 40vh; max-height: 60vh; overflow: auto;
    background-color: #0d0f12;
    background-image:
      linear-gradient(45deg, #171b22 25%, transparent 25%),
      linear-gradient(-45deg, #171b22 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #171b22 75%),
      linear-gradient(-45deg, transparent 75%, #171b22 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  }
  #shell { position: relative; }
  #shell img { display: block; image-rendering: pixelated; }
  .zone {
    position: absolute; border: 1.5px solid rgba(102, 224, 255, .95);
    background: rgba(102, 224, 255, .12);
  }
  .zone.live { cursor: move; }
  .zone.sel {
    border-color: #ffd24a; background: rgba(255, 210, 74, .22);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .5);
  }
  .zone > .tag {
    position: absolute; bottom: 100%; left: -2px; white-space: nowrap;
    background: #66e0ff; color: #06202a; font-size: 13px; font-weight: 700;
    line-height: 1.5; padding: 1px 7px; border-radius: 4px 4px 0 0;
  }
  .zone.sel > .tag { background: #ffd24a; color: #2a2000; }
  /* 손잡이는 화면 크기로 고정한다. 확대에 따라 줄어들게 해 놓았더니
     ×4 에서 2.5px 이 되어 집을 수가 없었다. */
  .zone > .h {
    position: absolute; width: 14px; height: 14px; background: #ffd24a;
    border: 1px solid #6b5200; border-radius: 3px;
  }
  .zone > .h.nw { left: -7px; top: -7px; cursor: nwse-resize; }
  .zone > .h.ne { right: -7px; top: -7px; cursor: nesw-resize; }
  .zone > .h.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
  .zone > .h.se { right: -7px; bottom: -7px; cursor: nwse-resize; }
  .zone > .h.n { left: 50%; top: -7px; margin-left: -7px; cursor: ns-resize; }
  .zone > .h.s { left: 50%; bottom: -7px; margin-left: -7px; cursor: ns-resize; }
  .zone > .h.w { top: 50%; left: -7px; margin-top: -7px; cursor: ew-resize; }
  .zone > .h.e { top: 50%; right: -7px; margin-top: -7px; cursor: ew-resize; }

  .under { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .under > * { min-width: 0; }
  dl {
    display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px;
    margin: 12px 0 0; font-size: 13px;
  }
  dt { color: #8b93a1; }
  dd { margin: 0; }
  code { color: #a8e6a3; font-size: 12.5px; word-break: break-all; user-select: all; }
  table { border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  th, td { padding: 2px 12px 2px 0; text-align: left; white-space: nowrap; }
  th { color: #8b93a1; font-weight: normal; border-bottom: 1px solid #2a303b; }
  td .key { cursor: pointer; }
  tbody td:first-child { cursor: pointer; }
  tbody input {
    width: 62px; background: #171b22; color: #dfe3ea; text-align: right;
    border: 1px solid #2a303b; border-radius: 4px; padding: 1px 5px;
    font: inherit; font-size: 12.5px; font-variant-numeric: tabular-nums;
  }
  tbody input:focus { outline: none; border-color: #6a8fd0; color: #fff; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { color: #fff; }
  tbody tr.sel td { color: #ffd24a; }
  pre {
    background: #0d0f12; border: 1px solid #2a303b; border-radius: 8px;
    margin: 0; padding: 11px 13px; overflow: auto; font-size: 12.5px;
    line-height: 1.45; max-height: 260px;
  }
  .bar { display: flex; gap: 7px; margin-top: 11px; flex-wrap: wrap; }
  button {
    background: #232833; color: #dfe3ea; border: 1px solid #39404e;
    border-radius: 6px; padding: 5px 12px; font: inherit; cursor: pointer;
  }
  button:hover { background: #2c323f; }
  button.on { background: #3d5a8a; border-color: #6a8fd0; color: #fff; }
  button.warm { border-color: #6b5200; color: #ffd24a; }
  #said { color: #8ce99a; font-size: 12.5px; align-self: center; }
  #dirty { color: #ffd24a; font-size: 12.5px; align-self: center; }
</style>

<h1>시안1 배치안이 쓰는 그림 · 구역 조정</h1>
<p class="hint">
  왼쪽에서 판을 고르면 그 위에 구역이 뜹니다. 끌어 옮기고 손잡이로 크기를
  바꿉니다 — <kbd>←↑↓→</kbd> 1px · <kbd>Shift</kbd> 10px ·
  <kbd>Alt</kbd> 크기 · <kbd>Tab</kbd> 다음 구역 · <kbd>Esc</kbd> 선택 해제 ·
  <kbd>Ctrl</kbd>+<kbd>Z</kbd> 되돌리기 · 휠 확대 · 가운데 단추로 밀기.
  표의 숫자는 직접 쳐도 됩니다.
  구역은 <b>역할별로 하나</b>라 아군 한 줄을 고치면 세 줄이 같이 바뀝니다.
</p>

<div class="cols">
  <div id="side"></div>
  <div id="main">
    <div id="canvas"><span style="color:#5a6270">왼쪽에서 고르세요</span></div>
    <div class="bar">
      <button id="zoom1">원래 크기</button>
      <button id="zoom2" class="on">×2</button>
      <button id="zoom4">×4</button>
      <span id="zoomLabel" style="color:#8b93a1;align-self:center">×2</span>
      <button id="zones" class="on">구역 표시</button>
      <button id="copy">코드 복사</button>
      <button id="save" class="warm">파일로 저장</button>
      <button id="spread">같은 판 전체에 적용</button>
      <button id="one">이 구역만 원래대로</button>
      <button id="undo">전부 원래 값으로</button>
      <span id="said"></span><span id="dirty"></span>
    </div>

    <div class="under">
      <div>
        <dl id="facts"></dl>
        <table><thead><tr>
          <th>구역</th><th>x</th><th>y</th><th>w</th><th>h</th><th></th>
        </tr></thead><tbody id="list"></tbody></table>
      </div>
      <div style="flex:1 1 400px">
        <h2 style="margin-top:12px">slot_table.py 에 붙일 코드</h2>
        <pre id="out"></pre>
      </div>
    </div>
  </div>
</div>

<script>
// 자료는 list_layout_art.py 가 여기에 박아 넣는다. 따로 두고 fetch 로 읽게
// 했더니 브라우저가 막았다 -- file:// 에서는 같은 폴더 파일도 fetch 가 안
// 된다(그림 태그는 된다).
const GROUPS = /*DATA*/null;
const BASE = /*TABLE*/null;

const KEEP = "rd.slots.01";
let TABLE = structuredClone(BASE || {});
let picked = null, mode = 2, showZones = true, sel = null;
let whole = true, selRole = null;
let nudgeKey = null, nudgeTimer = 0;

const $ = (id) => document.getElementById(id);

// 고친 값은 브라우저에 남긴다. 새로고침이나 창을 닫아도 되돌아가지 않게 --
// 픽셀 단위로 맞춘 것을 실수로 날리면 처음부터 다시다.
try {
  const kept = localStorage.getItem(KEEP);
  if (kept) TABLE = JSON.parse(kept);
} catch (err) { /* 저장이 막힌 환경이면 그냥 원래 값으로 간다 */ }

// 되돌리기 더미. 고치기 직전 값을 쌓아 두고 Ctrl+Z 로 꺼낸다. 픽셀 단위로
// 맞추다 보면 한 번 잘못 끌었을 때 되돌릴 길이 있어야 한다.
const past = [], future = [];
const SNAP = 120;   // 이만큼만 쌓는다. 더 쌓아 봐야 안 쓴다

function mark() {
  past.push(JSON.stringify(TABLE));
  if (past.length > SNAP) past.shift();
  future.length = 0;
}

function step(from, to) {
  if (!from.length) return false;
  to.push(JSON.stringify(TABLE));
  TABLE = JSON.parse(from.pop());
  paint();
  keep();
  return true;
}

function keep() {
  try { localStorage.setItem(KEEP, JSON.stringify(TABLE)); } catch (err) {}
  const same = JSON.stringify(TABLE) === JSON.stringify(BASE);
  $("dirty").textContent = same ? "" : "· 고친 값 있음(자동 저장됨)";
}

// pips 는 (x, y, 한 변, 간격, 개수)다. 상자로는 칸마다 보여 주되 끄는 것은
// 첫 칸뿐이다 -- 나머지는 간격 값대로 저절로 늘어선다.
const isPips = (key) => key === "pips";

function boxesOf(slots) {
  const out = [];
  for (const [key, v] of Object.entries(slots)) {
    if (!Array.isArray(v)) continue;          // align 같은 것은 건너뛴다
    if (isPips(key)) {
      const [x, y, side, step, count] = v;
      for (let i = 0; i < count; i += 1) {
        out.push({ key, label: key + "_" + i, live: i === 0,
                   box: [x + i * step, y, side, side] });
      }
    } else {
      out.push({ key, label: key, live: true, box: v.slice(0, 4) });
    }
  }
  return out;
}

function draw() {
  if (!GROUPS) {
    $("side").innerHTML = '<div style="padding:10px;color:#d97a7a">' +
      '자료가 안 박혔습니다. list_layout_art.py 를 다시 돌려 주세요.</div>';
    return;
  }
  $("side").innerHTML = "";
  // 전체 보기. 판을 하나씩만 보면 서로 어떻게 놓이는지 알 수 없다.
  const all = document.createElement("div");
  all.className = "it" + (whole ? " on" : "");
  all.style.cssText = "margin-bottom:8px;font-weight:700";
  all.innerHTML = '<span class="chip">\u25a6</span>' +
                  '<span class="nm">\uc804\uccb4 \ud654\uba74</span>';
  all.onclick = () => { whole = true; picked = null; sel = null; show(); };
  $("side").appendChild(all);

  for (const group of GROUPS) {
    const box = document.createElement("div");
    box.className = "grp";
    box.innerHTML = `<h3>${group.title} · ${group.items.length}</h3>` +
                    `<div class="who">${group.users}</div>`;
    for (const item of group.items) {
      const el = document.createElement("div");
      el.className = "it" + (item.png ? "" : " gone");
      el.innerHTML =
        `<span class="chip">${item.png ? `<img src="${item.png}">` : "?"}</span>` +
        `<span class="nm">${item.name}</span>`;
      el.onclick = () => {
        whole = false; picked = item; sel = null; show();
      };
      item.el = el;
      box.appendChild(el);
    }
    $("side").appendChild(box);
  }
  code();
  keep();
}

function show() {
  draw();
  const canvas = $("canvas");
  canvas.innerHTML = "";

  if (whole) {
    const shell = document.createElement("div");
    shell.id = "shell";
    const spread = plates();
    const wide = Math.max.apply(null, spread.map((it) => it.rect[0] + it.rect[2]));
    const tall = Math.max.apply(null, spread.map((it) => it.rect[1] + it.rect[3]));
    shell.style.width = wide * mode + "px";
    shell.style.height = tall * mode + "px";
    shell.style.background = "#0a0c10";
    for (const item of spread) {
      const img = new Image();
      img.src = item.png;
      img.style.cssText = "position:absolute;left:" + (item.rect[0] * mode) +
        "px;top:" + (item.rect[1] * mode) + "px;width:" +
        (item.rect[2] * mode) + "px;height:" + (item.rect[3] * mode) + "px";
      shell.appendChild(img);
    }
    canvas.appendChild(shell);
    paint();
    $("facts").innerHTML =
      "<dt>\ubcf4\uae30</dt><dd>\uc804\uccb4 \ud654\uba74</dd>" +
      "<dt>\ud310</dt><dd>" + spread.length + "\uc7a5</dd>" +
      "<dt>\ud06c\uae30</dt><dd>" + wide + " × " + tall + "</dd>";
    return;
  }

  if (!picked) return;

  if (!picked.png) {
    canvas.innerHTML =
      '<span style="color:#d97a7a">원본 PNG를 못 찾았습니다</span>';
    return;
  }
  const shell = document.createElement("div");
  shell.id = "shell";
  const img = new Image();
  img.onload = () => { fit(img); paint(); facts(img); };
  img.src = picked.png;
  shell.appendChild(img);
  canvas.appendChild(shell);
}

function rezoom() {
  if (whole) { show(); return; }
  const img = $("shell") && $("shell").querySelector("img");
  if (img) { fit(img); paint(); }
}

function fit(img) {
  img.style.width = img.naturalWidth * mode + "px";
  img.style.height = img.naturalHeight * mode + "px";
  const shell = $("shell");
  shell.style.width = img.style.width;
  shell.style.height = img.style.height;
}

function slots() {
  if (whole) return selRole ? TABLE[selRole] : null;
  if (picked && picked.role) { selRole = picked.role; return TABLE[selRole]; }
  return null;
}

function plates() {
  return GROUPS[0].items.filter((it) => it.rect && it.png);
}

function spots() {
  // (판 원점, 역할). 하나만 볼 때는 원점이 0,0 이고 전체에서는 판 자리다.
  if (!whole) {
    return (picked && picked.role) ? [[0, 0, picked.role]] : [];
  }
  return plates().map((it) => [it.rect[0], it.rect[1], it.role]);
}

function paint() {
  const shell = $("shell");
  if (!shell) return;
  for (const old of shell.querySelectorAll(".zone")) old.remove();
  if (!showZones) { list(); code(); return; }
  for (const spot of spots()) {
    if (TABLE[spot[2]]) zonesOf(shell, TABLE[spot[2]], spot[2], spot[0], spot[1]);
  }
  list();
  code();
}

function zonesOf(shell, table, role, ox, oy) {
  for (const item of boxesOf(table)) {
    const x = item.box[0] + ox, y = item.box[1] + oy;
    const w = item.box[2], h = item.box[3];
    const el = document.createElement("div");
    el.className = "zone" + (item.live ? " live" : "") +
                   (item.key === sel && role === selRole ? " sel" : "");
    el.style.cssText = `left:${x * mode}px;top:${y * mode}px;` +
      `width:${w * mode}px;height:${h * mode}px`;
    // 여덟 방향 손잡이. 모서리와 꼭짓점을 다 잡을 수 있어야 한쪽만 밀어
    // 맞추는 일이 된다 -- 오른쪽 아래 하나로는 왼쪽 끝을 못 옮긴다.
    const grips = item.live
      ? ["nw", "n", "ne", "w", "e", "sw", "s", "se"]
          .map((side) => `<div class="h ${side}" data-side="${side}"></div>`)
          .join("")
      : "";
    el.innerHTML = `<span class="tag">${item.label}</span>` + grips;
    if (item.live) {
      el.onmousedown = (e) =>
        grab(e, role, item.key, e.target.dataset.side || "");
    }
    shell.appendChild(el);
  }
}

function grab(e, role, key, side) {
  e.preventDefault();
  e.stopPropagation();
  // 숫자칸에 초점이 남아 있으면 방향키가 그 칸의 숫자를 오르내린다.
  // 구역을 집는 순간 초점을 뗀다.
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }
  sel = key;
  selRole = role;
  mark();
  const v = TABLE[role][key];
  const start = v.slice();
  const ox = e.clientX, oy = e.clientY;
  const square = isPips(key);   // 보석은 정사각형이라 한 변만 다룬다
  const move = (m) => {
    const dx = Math.round((m.clientX - ox) / mode);
    const dy = Math.round((m.clientY - oy) / mode);
    if (!side) {
      v[0] = start[0] + dx;
      v[1] = start[1] + dy;
      paint();
      return;
    }
    let [x, y, w, h] = [start[0], start[1], start[2], square ? start[2] : start[3]];
    if (side.includes("w")) { x = start[0] + dx; w = start[2] - dx; }
    if (side.includes("e")) { w = start[2] + dx; }
    if (side.includes("n")) { y = start[1] + dy; h = (square ? start[2] : start[3]) - dy; }
    if (side.includes("s")) { h = (square ? start[2] : start[3]) + dy; }
    // 뒤집히지 않게 막는다. 손잡이를 반대편으로 끌면 폭이 음수가 된다.
    if (w < 4) { x = start[0] + start[2] - 4; w = 4; }
    if (h < 4) { y = start[1] + (square ? start[2] : start[3]) - 4; h = 4; }
    v[0] = x; v[1] = y; v[2] = w;
    if (!square) v[3] = h;
    paint();
  };
  const up = () => {
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
    keep();
  };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  paint();
}

window.addEventListener("keydown", (e) => {
  const inField = e.target.tagName === "INPUT";
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !inField) {
    e.preventDefault();
    flash(step(e.shiftKey ? future : past, e.shiftKey ? past : future)
      ? (e.shiftKey ? "다시 했습니다" : "되돌렸습니다") : "더 없습니다");
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y" && !inField) {
    e.preventDefault();
    flash(step(future, past) ? "다시 했습니다" : "더 없습니다");
    return;
  }
  if (inField) return;

  const table = slots();
  if (e.key === "Escape") { sel = null; paint(); return; }
  if (e.key === "Tab" && table) {
    // 구역을 차례로 짚는다. 작은 상자는 마우스로 찾기가 번거롭다.
    e.preventDefault();
    const keys = Object.keys(table).filter((k) => Array.isArray(table[k]));
    const at = keys.indexOf(sel);
    sel = keys[(at + (e.shiftKey ? -1 : 1) + keys.length) % keys.length];
    paint();
    return;
  }
  if (!sel || !table) return;
  const at = { ArrowLeft: [-1, 0], ArrowRight: [1, 0],
               ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!at) return;
  e.preventDefault();
  // 같은 방향으로 이어 누르는 것은 한 번으로 묶는다. 한 칸씩 스무 번 민 것을
  // 스무 번 되돌리게 하면 쓸 수가 없다.
  if (nudgeKey !== e.key) { mark(); nudgeKey = e.key; }
  clearTimeout(nudgeTimer);
  nudgeTimer = setTimeout(() => { nudgeKey = null; }, 700);
  const step = e.shiftKey ? 10 : 1;
  const v = table[sel];
  if (e.altKey) {
    v[2] = Math.max(4, v[2] + at[0] * step);
    if (!isPips(sel)) v[3] = Math.max(4, v[3] + at[1] * step);
  } else {
    v[0] += at[0] * step;
    v[1] += at[1] * step;
  }
  paint();
  keep();
});

function facts(img) {
  $("facts").innerHTML =
    `<dt>이름</dt><dd>${picked.name}</dd>` +
    (picked.note ? `<dt>쓰이는 곳</dt><dd>${picked.note}</dd>` : "") +
    `<dt>크기</dt><dd>${img.naturalWidth} × ${img.naturalHeight}</dd>` +
    `<dt>엔진 경로</dt><dd><code>${picked.path}</code></dd>`;
}

function list() {
  const table = slots();
  const body = $("list");
  if (!table) { body.innerHTML = ""; return; }
  const rows = [];
  for (const [key, v] of Object.entries(table)) {
    if (!Array.isArray(v)) continue;
    // 숫자를 바로 칠 수 있게 한다. 끌어서 못 맞추는 값(간격 같은 것)도
    // 여기서 넣는다.
    const cells = v.map((n, i) =>
      `<td><input data-k="${key}" data-i="${i}" value="${n}"></td>`).join("");
    rows.push(`<tr class="${key === sel ? "sel" : ""}" data-k="${key}">` +
      `<td class="key">${key}</td>${cells}</tr>`);
  }
  body.innerHTML = rows.join("");
  for (const tr of body.children) {
    tr.querySelector(".key").onclick = () => { sel = tr.dataset.k; paint(); };
  }
  for (const input of body.querySelectorAll("input")) {
    input.onfocus = () => { sel = input.dataset.k; paint(); };
    input.onchange = () => {
      const got = parseFloat(input.value);
      if (Number.isNaN(got)) { list(); return; }
      mark();
      slots()[input.dataset.k][Number(input.dataset.i)] = got;
      paint();
      keep();
    };
  }
}

function pyText() {
  const lines = ['    "01": {'];
  for (const [role, keys] of Object.entries(TABLE)) {
    lines.push(`        "${role}": {`);
    for (const [key, v] of Object.entries(keys)) {
      lines.push(Array.isArray(v)
        ? `            "${key}": (${v.join(", ")}),`
        : `            "${key}": ${JSON.stringify(v)},`);
    }
    lines.push("        },");
  }
  lines.push("    },");
  return lines.join("\n");
}

function code() { $("out").textContent = pyText(); }

function flash(text) {
  $("said").textContent = text;
  setTimeout(() => { $("said").textContent = ""; }, 1800);
}

for (const [id, value] of [["zoom1", 1], ["zoom2", 2], ["zoom4", 4]]) {
  $(id).onclick = () => {
    mode = value;
    for (const other of ["zoom1", "zoom2", "zoom4"]) {
      $(other).classList.toggle("on", other === id);
    }
    $("zoomLabel").textContent = "×" + mode;
    rezoom();
  };
}

// 가운데 단추로 화면을 민다. 크게 키우면 판이 칸 밖으로 나가는데 스크롤
// 막대를 잡는 것보다 이쪽이 빠르다.
$("canvas").addEventListener("mousedown", (e) => {
  if (e.button !== 1) return;
  e.preventDefault();
  const box = $("canvas");
  const ox = e.clientX, oy = e.clientY;
  const left = box.scrollLeft, top = box.scrollTop;
  const move = (m) => {
    box.scrollLeft = left - (m.clientX - ox);
    box.scrollTop = top - (m.clientY - oy);
  };
  const up = () => {
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
  };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
});

// 휠로 확대·축소. 버튼만으로는 1·2·4 세 단계뿐이라 세밀하게 못 본다.
$("canvas").addEventListener("wheel", (e) => {
  if (!whole && (!picked || !picked.png)) return;
  e.preventDefault();
  const next = mode * (e.deltaY < 0 ? 1.25 : 0.8);
  mode = Math.min(16, Math.max(0.5, Math.round(next * 100) / 100));
  for (const other of ["zoom1", "zoom2", "zoom4"]) {
    $(other).classList.remove("on");
  }
  $("zoomLabel").textContent = "×" + (Math.round(mode * 100) / 100);
  rezoom();
}, { passive: false });

$("zones").onclick = () => {
  showZones = !showZones;
  $("zones").classList.toggle("on", showZones);
  paint();
};

$("copy").onclick = async () => {
  await navigator.clipboard.writeText(pyText());
  flash("코드를 복사했습니다");
};

// 브라우저는 파일을 제자리에 못 쓴다. 내려받은 뒤 apply_slots.py 가 그걸
// 읽어 slot_table.py 에 넣는다.
$("save").onclick = () => {
  const blob = new Blob([JSON.stringify(TABLE, null, 1)],
                        { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "slots_01.json";
  a.click();
  URL.revokeObjectURL(a.href);
  flash("slots_01.json 을 내려받았습니다 — apply_slots.py 로 넣으세요");
};

// 같은 종류 판 전체에 이 판의 값을 퍼뜨린다. 판마다 따로 맞추는 것이
// 원칙이지만, 처음 잡을 때는 하나 맞춰 놓고 퍼뜨린 뒤 다듬는 편이 빠르다.
$("spread").onclick = () => {
  if (!selRole) return;
  const kind = selRole.replace(/_\d+$/, "");
  const mates = Object.keys(TABLE)
    .filter((k) => k === kind || k.startsWith(kind + "_"));
  if (mates.length < 2) { flash("같은 종류 판이 하나뿐입니다"); return; }
  mark();
  for (const mate of mates) {
    if (mate !== selRole) TABLE[mate] = structuredClone(TABLE[selRole]);
  }
  paint();
  keep();
  flash(kind + " 판 " + mates.length + "장에 퍼뜨렸습니다");
};

// 고른 구역 하나만 처음 값으로.
$("one").onclick = () => {
  const table = slots();
  if (!sel || !table || !selRole || !BASE[selRole]) return;
  mark();
  table[sel] = structuredClone(BASE[selRole][sel]);
  paint();
  keep();
  flash(sel + " 를 원래 값으로");
};

$("undo").onclick = () => {
  if (!confirm("고친 값을 버리고 원래 값으로 되돌립니다.")) return;
  TABLE = structuredClone(BASE || {});
  try { localStorage.removeItem(KEEP); } catch (err) {}
  sel = null;
  paint();
  keep();
  flash("되돌렸습니다");
};

show();
</script>
